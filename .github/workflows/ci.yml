# .github/workflows/ci.yml
# ===================================================
# GitHub Actions CI/CD Pipeline — DevSecOps
# ===================================================
# Project : HorrorBot
# Version : 3.2
# Date    : June 2026
#
# Adapted from GitLab CI 3-tier pipeline.
# Branch model: runs on every branch push ('**') and on PRs targeting main.
#
# -- v3.2 note (DevSecOps hardening, aligned with the GitLab "strong" model) --
#   - Least-privilege GITHUB_TOKEN (top-level permissions: contents: read).
#   - Every third-party action/image pinned by immutable commit SHA / digest
#     (supply chain); the trailing `# vX.Y.Z` comment records the human tag.
#   - Structured audit logging (RGPD Art. 32 / HDS) via .github/scripts/audit.sh,
#     sourced by every security job (scan_start / scan_end + workflow config hash).
#   - step-security/harden-runner (egress audit) on every non-container job
#     (skips frontend-tests + the OWASP container job; posts egress telemetry).
#   - Docker image integrity check before Trivy (loaded-image id + size).
#   - pipeline-status gate is skip-tolerant (fails only on failure/cancelled).
#   SonarQube (Tier 3 of the GitLab model) is intentionally NOT used here.
#
# -- 2-tier architecture --
#
#   Tier 1 (every push, feedback < 3 min):
#     tests, frontend-tests, bandit, gitleaks,
#     python-deps-scan, hadolint
#
#   Tier 2 (every push, heavier 10-30 min):
#     export-deps → owasp, docker+trivy
#
# -- Execution strategy per job --
#
#   Job                     | push/PR | Blocking?
#   ------------------------|---------|----------------------------
#   tests                   |    ✓    | Always
#   frontend-tests          |    ✓    | Always
#   security-bandit         |    ✓    | Always
#   security-gitleaks       |    ✓    | Always
#   security-python-deps    |    ✓    | Always
#   security-hadolint       |    ✓    | Always (via .hadolint.yaml)
#   prepare-export-deps     |    ✓    | —
#   security-owasp          |    ✓    | Always (CVSS ≥ 7)
#   security-docker-trivy   |    ✓    | Always (CRITICAL,HIGH)
#   pipeline-status         |    ✓    | Single gate
#
# -- Pre-commit / CI consistency --
#
#   - Ruff, Vulture           → pre-commit only
#   - Bandit                  → pre-commit + CI (JSON report → SonarQube)
#   - Gitleaks                → pre-commit (staged) + CI (full history)
#   - Tests, deps scan, OWASP → CI only
#   - Hadolint (Dockerfile)   → CI only (blocking, .hadolint.yaml)
#   - Trivy (Docker image)    → CI only (OS-level CVEs only, TRIVY_PKG_TYPES=os)
# ===================================================

name: CI/CD Pipeline — DevSecOps

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# ===================================================
# Least-privilege GITHUB_TOKEN (supply-chain hardening)
# ===================================================
# No job pushes code/images, comments, or creates releases, so a
# read-only token is sufficient. Escalate per-job (e.g. id-token:
# write) only if a future job needs it. Artifact up/download is
# unaffected (separate runtime token).
permissions:
  contents: read

# ===================================================
# Supply-chain hardening notes
# ===================================================
# - Every third-party action/image is pinned by immutable commit SHA
#   / image digest (the `# vX.Y.Z` comment records the human tag).
#   Re-resolve digests before bumping a tag.
# - step-security/harden-runner runs in `audit` mode (non-blocking):
#   it posts egress telemetry to api.stepsecurity.io. Drop the step if
#   external CI telemetry is disallowed by the data policy.

# ===================================================
# Global variables
# ===================================================
env:
  PYTHON_VERSION: "3.12"
  PYTHONUNBUFFERED: "1"
  REPORT_DIR: reports
  SECURITY_DIR: security-reports
  TRIVY_SEVERITY: "CRITICAL,HIGH"

# ===================================================
# Concurrency — cancel previous runs on same branch
# ===================================================
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ===================================================
# JOBS
# ===================================================
jobs:

  # ###########################################################
  #  TIER 1 — Fast feedback (< 3 min)
  # ###########################################################

  # ===================================================
  # Tests Python (unit + coverage)
  # ===================================================
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group dev --group ml

      - name: Run unit tests with coverage
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ENVIRONMENT: test
        run: |
          mkdir -p "${{ env.REPORT_DIR }}"
          uv run pytest -v --tb=short \
            -m "not slow and not integration" \
            --junitxml="${{ env.REPORT_DIR }}/junit.xml" \
            --cov=src \
            --cov-report=xml:"${{ env.REPORT_DIR }}/coverage.xml" \
            --cov-report=html:"${{ env.REPORT_DIR }}/htmlcov" \
            --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: ${{ env.REPORT_DIR }}/coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-reports
          path: ${{ env.REPORT_DIR }}/
          retention-days: 7

  # ===================================================
  # Tests Frontend (lint + type-check + tests + build)
  # ===================================================
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type-check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:run

      - name: Build production
        run: npm run build

      - name: Verify bundle size (gzipped < 150 KB)
        run: |
          TOTAL=$(find dist -type f \( -name '*.js' -o -name '*.css' \) -exec gzip -c {} \; | wc -c)
          TOTAL_KB=$((TOTAL / 1024))
          echo "Total gzipped bundle: ${TOTAL_KB} KB (limit: 150 KB)"
          if [ "$TOTAL_KB" -gt 150 ]; then
            echo "::error::Bundle ${TOTAL_KB} KB exceeds 150 KB"
            exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        run: npm run test:a11y -- --project=chromium

      - name: Run e2e functional tests
        run: npx playwright test e2e/auth.spec.ts e2e/chat.spec.ts e2e/films.spec.ts --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 7

  # ===================================================
  # Bandit — SAST (blocking)
  # ===================================================
  security-bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Bandit security scan
        run: |
          mkdir -p "${{ env.SECURITY_DIR }}"
          . .github/scripts/audit.sh
          audit_log "scan_start" "running"
          echo "=== Running Bandit SAST analysis ==="
          set +e
          timeout 4m uvx bandit[toml] -c pyproject.toml -r src -f json \
            -o "${{ env.SECURITY_DIR }}/bandit-report.json"
          BANDIT_STATUS=$?
          set -e

          if [ -f "${{ env.SECURITY_DIR }}/bandit-report.json" ] && \
             [ -s "${{ env.SECURITY_DIR }}/bandit-report.json" ]; then
            echo "[OK] Bandit report generated"
            if [ ${BANDIT_STATUS} -eq 0 ]; then
              echo "[OK] No security issues detected"
            else
              echo "[WARN] Security issues detected (exit code: ${BANDIT_STATUS})"
              python3 -m json.tool "${{ env.SECURITY_DIR }}/bandit-report.json" | head -50
            fi
          else
            echo "[FAIL] Bandit report missing or empty"
            BANDIT_STATUS=1
          fi

          if [ ${BANDIT_STATUS} -ne 0 ]; then
            audit_log "scan_end" "fail" "exit_code=${BANDIT_STATUS}"
            echo "::error::Bandit detected security issues — must be resolved"
            exit ${BANDIT_STATUS}
          fi
          audit_log "scan_end" "pass" "issues=0"

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: bandit-report
          path: ${{ env.SECURITY_DIR }}/bandit-report.json
          retention-days: 7

  # ===================================================
  # Gitleaks — Secret detection (blocking)
  # ===================================================
  security-gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Create security reports directory
        run: mkdir -p "${{ env.SECURITY_DIR }}"

      - name: Audit — scan start
        run: |
          . .github/scripts/audit.sh
          audit_log "scan_start" "running"

      - name: Run Gitleaks (full history)
        id: gitleaks
        uses: docker://zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # :latest pinned 2026-06-17
        with:
          args: >-
            detect
            --source="."
            --report-format=json
            --report-path=security-reports/gitleaks-report.json
            --verbose

      - name: Audit — scan end
        if: always()
        run: |
          . .github/scripts/audit.sh
          if [ "${{ steps.gitleaks.outcome }}" = "success" ]; then
            audit_log "scan_end" "pass" "secrets=0"
          else
            audit_log "scan_end" "fail" "secrets_detected=true"
          fi

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: gitleaks-report
          path: security-reports/gitleaks-report.json
          retention-days: 7

  # ===================================================
  # Python dependency scan — pip-audit + safety (blocking)
  # ===================================================
  # pip-audit: scans via exported requirements (avoids editable
  # package resolution failure on local project).
  # safety: exit code 64 = operational error (auth/network),
  # not a vulnerability finding — treated as non-blocking.
  security-python-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Export requirements for pip-audit
        run: |
          # Strip crawl4ai: its metadata pins `lxml~=5.3` which conflicts with
          # our [tool.uv] override-dependencies = ["lxml>=6.1.0"]. pip's dry-run
          # resolver (invoked by pip-audit) does not honour uv overrides and
          # fails the whole audit. Crawl4ai's own CVEs are covered by OWASP DC
          # (suppression.xml) and safety, so dropping it here is loss-free.
          uv export --frozen --all-groups --all-extras --no-hashes \
            | grep -v "^torch==" \
            | grep -v "^nvidia-" \
            | grep -v "^cuda-" \
            | grep -v "^triton==" \
            | grep -v "^crawl4ai==" \
            | grep -v "^horrorbot" \
            | grep -v "^-e " \
            | grep -v "^\./" \
            | grep -v "^file:" \
            > /tmp/requirements-audit.txt
          echo "[OK] requirements-audit.txt generated ($(wc -l < /tmp/requirements-audit.txt) deps)"

      - name: Run pip-audit + safety scans
        run: |
          mkdir -p "${{ env.SECURITY_DIR }}"
          . .github/scripts/audit.sh
          audit_log "scan_start" "running"
          echo "=== Python Dependency Security Scans ==="

          # -- pip-audit: scans via requirements file only --
          # uvx runs in isolated env, avoids editable horrorbot in venv
          # pip-audit scans ALL installed packages, not just requirements.txt; torch is in venv despite uv export filtering.
          # --ignore-vuln entries: all have NO upstream fix as of 2026-05-21.
          #   CVE-2025-69872  diskcache: pickle deserialization — transitive via llama-cpp-python, local cache only
          #   GHSA-wj6h-64fc-37mp  ecdsa: Minerva timing attack — vendor refuses to fix; not exploitable on localhost-only
          #   CVE-2024-34997  joblib: deserialization in NumpyArrayWrapper — transitive ML dep; disputed, HorrorBot loads only trusted local models
          #   CVE-2025-45768  pyjwt: weak encryption — DISPUTED by supplier; key length is application-controlled, not a library bug
          #   CVE-2024-29370  python-jose: JWE DoS — HorrorBot uses JWT only (not JWE), localhost-only deployment
          #   CVE-2026-0846   nltk: filestring() arbitrary read — HorrorBot does not call filestring() with user input
          #   CVE-2025-14920..14930  transformers: deserialization/code-injection on untrusted model loading —
          #     HorrorBot loads only fixed HuggingFace models (MiniLM, mMiniLMv2) at startup; affected model types
          #     (Perceiver, Transformer-XL, megatron_gpt2, SEW, X-CLIP, GLM4) are not used.
          #   CVE-2025-63396, CVE-2025-3000..3001, CVE-2025-2998..2999, CVE-2025-2953, CVE-2025-3121, CVE-2025-3136, CVE-2025-2148..2149, CVE-2026-4538
          #     pytorch ×11: JIT memory corruption, LSTM/RNN ops, DoS — local-only, no untrusted model loading in HorrorBot.
          #   GHSA-g75f-g53v-794x  bleach: ReDoS in linkify(parse_email=True) — NO upstream fix (bleach archived);
          #     transitive via kaggle (offline ETL), HorrorBot never calls linkify on attacker input. Other two bleach
          #     advisories (GHSA-gj48/-8rfp) fixed by bump to 6.4.0.
          # Review 2026-11-19.
          echo "--- pip-audit vulnerability scan ---"
          set +e
          uvx pip-audit --strict \
            -r /tmp/requirements-audit.txt \
            --no-deps \
            --ignore-vuln CVE-2025-69872 \
            --ignore-vuln GHSA-wj6h-64fc-37mp \
            --ignore-vuln CVE-2024-34997 \
            --ignore-vuln CVE-2025-45768 \
            --ignore-vuln CVE-2024-29370 \
            --ignore-vuln CVE-2026-0846 \
            --ignore-vuln CVE-2025-14920 \
            --ignore-vuln CVE-2025-14921 \
            --ignore-vuln CVE-2025-14924 \
            --ignore-vuln CVE-2025-14926 \
            --ignore-vuln CVE-2025-14927 \
            --ignore-vuln CVE-2025-14928 \
            --ignore-vuln CVE-2025-14929 \
            --ignore-vuln CVE-2025-14930 \
            --ignore-vuln CVE-2025-63396 \
            --ignore-vuln CVE-2025-3000 \
            --ignore-vuln CVE-2025-3121 \
            --ignore-vuln CVE-2025-3001 \
            --ignore-vuln CVE-2025-2999 \
            --ignore-vuln CVE-2025-2998 \
            --ignore-vuln CVE-2026-4538 \
            --ignore-vuln CVE-2025-2953 \
            --ignore-vuln CVE-2025-3136 \
            --ignore-vuln CVE-2025-2148 \
            --ignore-vuln CVE-2025-2149 \
            --ignore-vuln GHSA-g75f-g53v-794x \
            -f json \
            -o "${{ env.SECURITY_DIR }}/pip-audit.json"
          PIPA_STATUS=$?
          set -e

          if [ ${PIPA_STATUS} -ne 0 ] && \
             [ -f "${{ env.SECURITY_DIR }}/pip-audit.json" ] && \
             [ -s "${{ env.SECURITY_DIR }}/pip-audit.json" ]; then
            echo "[WARN] pip-audit detected vulnerabilities"
            python3 -m json.tool "${{ env.SECURITY_DIR }}/pip-audit.json" | head -50
          else
            echo "[OK] pip-audit clean"
          fi

          # -- safety: scans the installed environment --
          echo "--- Safety vulnerability scan ---"
          set +e
          uv run safety check --output json \
            2>"${{ env.SECURITY_DIR }}/safety-stderr.txt" \
            > "${{ env.SECURITY_DIR }}/safety-report.json"
          SAFETY_STATUS=$?
          set -e

          # safety exit code 64 = operational error (auth/network), not vulnerabilities
          if [ ${SAFETY_STATUS} -eq 64 ]; then
            echo "[WARN] Safety operational error (auth/network) — skipping"
            cat "${{ env.SECURITY_DIR }}/safety-stderr.txt" 2>/dev/null || true
            SAFETY_STATUS=0
          elif [ ${SAFETY_STATUS} -ne 0 ] && \
               [ -f "${{ env.SECURITY_DIR }}/safety-report.json" ] && \
               [ -s "${{ env.SECURITY_DIR }}/safety-report.json" ]; then
            echo "[WARN] Safety detected vulnerabilities"
            python3 -m json.tool "${{ env.SECURITY_DIR }}/safety-report.json" | head -50
          fi

          # -- Aggregated result --
          FINAL_STATUS=$(( PIPA_STATUS + SAFETY_STATUS ))
          if [ ${FINAL_STATUS} -ne 0 ]; then
            audit_log "scan_end" "fail" "pip_audit=${PIPA_STATUS},safety=${SAFETY_STATUS}"
            echo "::error::Vulnerabilities detected (pip-audit: ${PIPA_STATUS}, safety: ${SAFETY_STATUS})"
            exit 1
          else
            audit_log "scan_end" "pass" "pip_audit=0,safety=0"
            echo "[OK] All Python dependency scans passed"
          fi

      - name: Upload dependency scan reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dependency-security-reports
          path: |
            ${{ env.SECURITY_DIR }}/pip-audit.json
            ${{ env.SECURITY_DIR }}/safety-report.json
            ${{ env.SECURITY_DIR }}/safety-stderr.txt
          retention-days: 7

  # ===================================================
  # Hadolint — Dockerfile lint (blocking on errors)
  # ===================================================
  # Uses .hadolint.yaml for rule exclusions.
  # Scans both API and Frontend Dockerfiles.
  # no-fail: true lets hadolint save reports even with warnings.
  # Blocking logic is in the "Check results" step (errors only).
  security-hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Create security reports directory
        run: mkdir -p "${{ env.SECURITY_DIR }}"

      - name: Hadolint — docker/api/Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: docker/api/Dockerfile
          format: json
          output-file: security-reports/hadolint-api.json
          no-fail: true

      - name: Hadolint — docker/frontend/Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: docker/frontend/Dockerfile
          format: json
          output-file: security-reports/hadolint-frontend.json
          no-fail: true

      - name: Merge Hadolint reports
        if: always()
        run: |
          jq -s 'add // []' \
            security-reports/hadolint-api.json \
            security-reports/hadolint-frontend.json \
            > "${{ env.SECURITY_DIR }}/hadolint-report.json" || true

      - name: Check Hadolint results
        run: |
          REPORT="${{ env.SECURITY_DIR }}/hadolint-report.json"
          if [ ! -f "${REPORT}" ] || [ ! -s "${REPORT}" ]; then
            echo "[OK] No Hadolint issues found"
            exit 0
          fi

          # Count error-level issues (blocking)
          ERROR_COUNT=$(jq '[.[] | select(.level == "error")] | length' "${REPORT}" 2>/dev/null || echo "0")
          WARN_COUNT=$(jq '[.[] | select(.level == "warning")] | length' "${REPORT}" 2>/dev/null || echo "0")
          INFO_COUNT=$(jq '[.[] | select(.level == "info" or .level == "style")] | length' "${REPORT}" 2>/dev/null || echo "0")

          echo "[STAT] Errors: ${ERROR_COUNT}, Warnings: ${WARN_COUNT}, Info/Style: ${INFO_COUNT}"

          if [ "${ERROR_COUNT}" -gt 0 ]; then
            echo "::error::Hadolint found ${ERROR_COUNT} error(s) — must be resolved"
            jq '.[] | select(.level == "error")' "${REPORT}"
            exit 1
          fi

          if [ "${WARN_COUNT}" -gt 0 ]; then
            echo "[WARN] ${WARN_COUNT} warning(s) — review recommended"
            jq '.[] | select(.level == "warning") | "\(.code): \(.message) (\(.file):\(.line))"' "${REPORT}"
          fi

          echo "[OK] Hadolint passed (no blocking errors)"

      - name: Upload Hadolint report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: hadolint-report
          path: ${{ env.SECURITY_DIR }}/hadolint-report.json
          retention-days: 7

  # ###########################################################
  #  TIER 2 — Heavier validation (10-30 min)
  # ###########################################################

  # ===================================================
  # Prepare — Export dependencies from uv.lock
  # ===================================================
  # Required by OWASP Dependency-Check (needs requirements.txt).
  prepare-export-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Export dependencies from uv.lock
        run: |
          echo "=== Ephemeral generation of requirements.txt from uv.lock ==="
          uv export --frozen --no-dev --no-hashes > requirements.txt
          uv export --frozen --all-groups --all-extras --no-hashes > requirements-full.txt
          echo "[OK] requirements.txt generated ($(wc -l < requirements.txt) prod dependencies)"
          echo "[OK] requirements-full.txt generated ($(wc -l < requirements-full.txt) total dependencies)"

      - name: Upload requirements artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: requirements
          path: |
            requirements.txt
            requirements-full.txt
          retention-days: 1

  # ===================================================
  # OWASP Dependency-Check (blocking, CVSS ≥ 7)
  # ===================================================
  security-owasp:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [prepare-export-deps]

    container:
      image: owasp/dependency-check-action@sha256:71c7d3391628cfa22dd45e062744996540b811f20dbad000fbe84246a00f4827 # :latest pinned 2026-06-17
      options: --user root

    env:
      _JAVA_OPTIONS: >-
        -Xmx2g -Xms256m
        -XX:MaxMetaspaceSize=256m
        -XX:+UseG1GC -XX:+UseStringDeduplication
        -XX:G1HeapRegionSize=8m -XX:MaxGCPauseMillis=200
        -XX:ParallelGCThreads=2 -XX:ConcGCThreads=1
        -XX:+UseCompressedOops
        -Dfile.encoding=UTF-8
      JAVA_OPTS: "-Xmx2g -Dfile.encoding=UTF-8"
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download requirements artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: requirements

      # npm install so that OWASP Node Audit Analyzer can scan node_modules
      - name: Install frontend dependencies for OWASP
        run: |
          if [ -f "src/frontend/package-lock.json" ]; then
            cd src/frontend && npm ci --ignore-scripts && cd ../..
            echo "[OK] node_modules installed for OWASP Node Audit"
          else
            echo "[WARN] No package-lock.json found — skipping npm install"
          fi

      - name: Run OWASP Dependency-Check
        run: |
          mkdir -p "${{ env.SECURITY_DIR }}/dependency-check"
          . .github/scripts/audit.sh
          audit_log "scan_start" "running"
          echo "=== OWASP Dependency-Check ==="
          echo "[INFO] requirements.txt ($(wc -l < requirements.txt) deps)"

          set +e
          timeout 40m \
          /usr/share/dependency-check/bin/dependency-check.sh \
            --project "HorrorBot" \
            --scan . \
            --format HTML \
            --format JSON \
            --format XML \
            --out "${{ env.SECURITY_DIR }}/dependency-check" \
            --noupdate \
            --enableExperimental \
            --exclude "**/node_modules/**" \
            --exclude "**/tests/**" \
            --exclude "**/test/**" \
            --exclude "**/__pycache__/**" \
            --exclude "**/.git/**" \
            --exclude "**/.pytest_cache/**" \
            --exclude "**/*.pyc" \
            --exclude "**/htmlcov/**" \
            --exclude "**/.cache/**" \
            --exclude "**/reports/**" \
            --exclude "**/security-reports/**" \
            --exclude "**/pyproject.toml" \
            --exclude "**/dist/**" \
            --exclude "**/build/**" \
            --exclude "**/.venv/**" \
            --disableNodeAudit \
            $([ -f "$GITHUB_WORKSPACE/suppression.xml" ] && echo "--suppression $GITHUB_WORKSPACE/suppression.xml" || echo "") \
            --failOnCVSS 7
          OWASP_STATUS=$?
          set -e

          if [ ${OWASP_STATUS} -eq 124 ]; then
            audit_log "scan_end" "fail" "reason=timeout_40m"
            echo "::error::OWASP Dependency-Check timed out after 40 minutes"
            exit 1
          fi

          echo "=== Scan finished with code ${OWASP_STATUS} ==="
          ls -lh "${{ env.SECURITY_DIR }}/dependency-check/" || true

          if [ -f "${{ env.SECURITY_DIR }}/dependency-check/dependency-check-report.json" ] && \
             [ -s "${{ env.SECURITY_DIR }}/dependency-check/dependency-check-report.json" ]; then
            echo "[OK] JSON report generated"
            VULN_COUNT=$(grep -c '"severity"' \
              "${{ env.SECURITY_DIR }}/dependency-check/dependency-check-report.json" || echo "0")
            echo "[STAT] Vulnerabilities found: ${VULN_COUNT}"
          else
            echo "::error::OWASP JSON report missing or empty — scan likely failed"
            OWASP_STATUS=1
          fi

          if [ ${OWASP_STATUS} -ne 0 ]; then
            audit_log "scan_end" "fail" "exit_code=${OWASP_STATUS},cvss_threshold=7"
            echo "::error::OWASP Dependency-Check found CVEs with CVSS >= 7"
            exit ${OWASP_STATUS}
          fi
          audit_log "scan_end" "pass" "vuln_count=0,cvss_threshold=7"

      - name: Upload OWASP reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: owasp-dependency-check
          path: ${{ env.SECURITY_DIR }}/dependency-check/
          retention-days: 7

  # ===================================================
  # Docker Build + Trivy — Container scan (blocking)
  # ===================================================
  security-docker-trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: horrorbot-api
            dockerfile: docker/api/Dockerfile
            label: api
          - image: horrorbot-frontend
            dockerfile: docker/frontend/Dockerfile
            label: frontend

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image — ${{ matrix.label }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image }}:ci-scan

      - name: Create security reports directory
        run: mkdir -p security-reports

      # Integrity equivalent of the kaniko tarball check (strong model):
      # the image is loaded into the local daemon, so we assert it exists
      # and is non-trivial, and record its content-addressable id for audit.
      - name: Audit — image integrity & scan start — ${{ matrix.label }}
        run: |
          . .github/scripts/audit.sh
          audit_log "scan_start" "running" "image=${{ matrix.image }}:ci-scan"
          IMG_ID=$(docker image inspect "${{ matrix.image }}:ci-scan" --format '{{.Id}}' 2>/dev/null || echo "")
          IMG_SIZE=$(docker image inspect "${{ matrix.image }}:ci-scan" --format '{{.Size}}' 2>/dev/null || echo "0")
          if [ -z "${IMG_ID}" ] || [ "${IMG_SIZE}" -lt 1024 ]; then
            audit_log "image_check" "fail" "reason=missing_or_too_small,size=${IMG_SIZE}"
            echo "::error::Built image missing or suspiciously small (${IMG_SIZE} bytes)"
            exit 1
          fi
          audit_log "image_check" "pass" "image_id=${IMG_ID#sha256:},size=${IMG_SIZE}"
          echo "[OK] Image integrity verified (${IMG_ID}, ${IMG_SIZE} bytes)"

      # Trivy scans OS-level CVEs only (TRIVY_PKG_TYPES=os).
      # Python/JS/JAR deps are handled by OWASP Dependency-Check (security-owasp job)
      # to avoid double-scanning and diverging suppression files.
      # Note: trivy-action 0.35.0 has no `pkg-types` input — the restriction is
      # applied via the TRIVY_PKG_TYPES env var, which the trivy binary reads.
      # (pkg-types replaces the deprecated --vuln-type flag since Trivy >= 0.56.)
      - name: Trivy scan (table) — ${{ matrix.label }}
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        env:
          TRIVY_PKG_TYPES: os
        with:
          image-ref: ${{ matrix.image }}:ci-scan
          scanners: vuln
          format: table
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: "0"
          trivyignores: .trivyignore

      # Blocking scan — exit-code 1 fails the job on CRITICAL/HIGH OS CVEs
      - name: Trivy scan (JSON, blocking) — ${{ matrix.label }}
        id: trivy_json
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        env:
          TRIVY_PKG_TYPES: os
        with:
          image-ref: ${{ matrix.image }}:ci-scan
          scanners: vuln
          format: json
          severity: ${{ env.TRIVY_SEVERITY }}
          output: security-reports/trivy-${{ matrix.label }}-report.json
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

      # Diagnostic — always print the list of blocking CVEs in readable form,
      # so failing runs surface package/version/fix info directly in the log.
      - name: Summarize Trivy CVEs — ${{ matrix.label }}
        if: always()
        run: |
          REPORT="security-reports/trivy-${{ matrix.label }}-report.json"
          if [ ! -s "${REPORT}" ]; then
            echo "::warning::Trivy JSON report missing or empty: ${REPORT}"
            exit 0
          fi
          echo "=== Blocking CVEs (CRITICAL/HIGH, fixes available) — ${{ matrix.label }} ==="
          jq -r '
            .Results[]?
            | .Target as $target
            | .Vulnerabilities[]?
            | select(.FixedVersion != null and .FixedVersion != "")
            | "[\(.Severity)] \(.VulnerabilityID)  pkg=\(.PkgName)@\(.InstalledVersion)  fix=\(.FixedVersion)  target=\($target)"
          ' "${REPORT}" | sort -u
          echo "=== end ==="

      - name: Upload Trivy report — ${{ matrix.label }}
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: trivy-report-${{ matrix.label }}
          path: security-reports/trivy-${{ matrix.label }}-report.json
          retention-days: 7

      - name: Audit — scan end — ${{ matrix.label }}
        if: always()
        run: |
          . .github/scripts/audit.sh
          if [ "${{ steps.trivy_json.outcome }}" = "success" ]; then
            audit_log "scan_end" "pass" "severity=${{ env.TRIVY_SEVERITY }}"
          else
            audit_log "scan_end" "fail" "severity=${{ env.TRIVY_SEVERITY }}"
          fi

  # ###########################################################
  #  PIPELINE STATUS — Single gate
  # ###########################################################
  # Final job aggregating all checks for branch protection.
  pipeline-status:
    runs-on: ubuntu-latest
    if: always()
    needs:
      # -- Tier 1 --
      - tests
      - frontend-tests
      - security-bandit
      - security-gitleaks
      - security-python-deps
      - security-hadolint
      # -- Tier 2 --
      - prepare-export-deps
      - security-owasp
      - security-docker-trivy

    steps:
      - name: Check pipeline result
        run: |
          echo "=== Pipeline Status ==="
          echo "tests:              ${{ needs.tests.result }}"
          echo "frontend-tests:     ${{ needs.frontend-tests.result }}"
          echo "security-bandit:    ${{ needs.security-bandit.result }}"
          echo "security-gitleaks:  ${{ needs.security-gitleaks.result }}"
          echo "security-python-deps: ${{ needs.security-python-deps.result }}"
          echo "security-hadolint:  ${{ needs.security-hadolint.result }}"
          echo "prepare-export-deps: ${{ needs.prepare-export-deps.result }}"
          echo "security-owasp:     ${{ needs.security-owasp.result }}"
          echo "security-docker-trivy: ${{ needs.security-docker-trivy.result }}"

          # All jobs must succeed
          FAILED=0
          for result in \
            "${{ needs.tests.result }}" \
            "${{ needs.frontend-tests.result }}" \
            "${{ needs.security-bandit.result }}" \
            "${{ needs.security-gitleaks.result }}" \
            "${{ needs.security-python-deps.result }}" \
            "${{ needs.security-hadolint.result }}" \
            "${{ needs.prepare-export-deps.result }}" \
            "${{ needs.security-owasp.result }}" \
            "${{ needs.security-docker-trivy.result }}"; do
            # Fail on failure/cancelled; tolerate success/skipped (a job may
            # legitimately skip — e.g. future path-scoping — without weakening
            # the gate). 'skipped' propagates here only if a *needed* upstream
            # job was itself skipped, which is an accepted no-op.
            case "${result}" in
              success | skipped) ;;
              *) FAILED=$((FAILED + 1)) ;;
            esac
          done

          if [ ${FAILED} -ne 0 ]; then
            echo "::error::${FAILED} job(s) failed — pipeline blocked"
            exit 1
          fi

          echo "[OK] All pipeline checks passed"